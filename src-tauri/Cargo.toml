[package]
name = "beid-desktop"
version = "0.3.0"
description = "BEID desktop shell (Tauri)"
authors = ["BEID"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "beid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
